services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-erp_sst}
      POSTGRES_USER: ${POSTGRES_USER:-erp_sst_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerido}
    volumes: [postgres_data:/var/lib/postgresql/data]
    security_opt: [no-new-privileges:true]
    shm_size: 256m
    deploy:
      resources:
        limits: {memory: 1G, cpus: "1.0"}
        reservations: {memory: 256M, cpus: "0.25"}
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, "yes", --requirepass, "${REDIS_PASSWORD:?REDIS_PASSWORD requerido}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD requerido}
    volumes: [redis_data:/data]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: {memory: 256M, cpus: "0.5"}
        reservations: {memory: 64M, cpus: "0.10"}
    healthcheck:
      test: [CMD-SHELL, 'redis-cli --no-auth-warning ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    image: erp-sst-backend:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-erp_sst_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-erp_sst}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY requerido}
      ENVIRONMENT: production
      AUTO_CREATE_TABLES: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS requerido}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:?TRUSTED_HOSTS requerido}
      TRUSTED_PROXY_NETWORKS: ${TRUSTED_PROXY_NETWORKS:?TRUSTED_PROXY_NETWORKS requerido}
      ACCESS_COOKIE_SECURE: "true"
      REFRESH_COOKIE_SECURE: "true"
      REFRESH_COOKIE_PATH: /api/auth
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_BACKEND: redis
      RATE_LIMIT_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      UPLOAD_DIR: /app/app/uploads
      LOG_DIR: /app/logs
    command: [gunicorn, app.main:app, -k, uvicorn.workers.UvicornWorker, --bind, 0.0.0.0:8000, --workers, "2", --timeout, "120", --access-logfile, -, --error-logfile, -]
    volumes:
      - uploads_data:/app/app/uploads
      - logs_data:/app/logs
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    tmpfs: [/tmp:size=128m,mode=1777]
    deploy:
      resources:
        limits: {memory: 1G, cpus: "1.0"}
        reservations: {memory: 256M, cpus: "0.25"}
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, 'curl --fail --silent --show-error -H "Host: $${TRUSTED_HOSTS%%,*}" http://127.0.0.1:8000/health >/dev/null']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  backend-migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    image: erp-sst-backend:${IMAGE_TAG:-local}
    profiles: [migrations]
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-erp_sst_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-erp_sst}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY requerido}
      ENVIRONMENT: production
      AUTO_CREATE_TABLES: "false"
    command: [alembic, upgrade, head]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    depends_on:
      db: {condition: service_healthy}
    networks: [default]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args: {VITE_API_URL: /api}
    image: erp-sst-frontend:${IMAGE_TAG:-local}
    restart: unless-stopped
    expose: ["8080"]
    networks: [default, coolify]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /var/cache/nginx:size=64m,uid=101,gid=101
    deploy:
      resources:
        limits: {memory: 256M, cpus: "0.5"}
        reservations: {memory: 64M, cpus: "0.10"}
    labels:
      traefik.enable: "true"
      traefik.docker.network: coolify
      traefik.http.middlewares.erp-sst-compress.compress: "true"
      traefik.http.middlewares.erp-sst-https.redirectscheme.scheme: https
      traefik.http.routers.erp-sst-http.entrypoints: http
      traefik.http.routers.erp-sst-http.rule: Host(`${APP_DOMAIN:?APP_DOMAIN requerido}`)
      traefik.http.routers.erp-sst-http.middlewares: erp-sst-https
      traefik.http.routers.erp-sst-http.service: erp-sst
      traefik.http.routers.erp-sst-secure.entrypoints: https
      traefik.http.routers.erp-sst-secure.rule: Host(`${APP_DOMAIN:?APP_DOMAIN requerido}`)
      traefik.http.routers.erp-sst-secure.middlewares: erp-sst-compress
      traefik.http.routers.erp-sst-secure.service: erp-sst
      traefik.http.routers.erp-sst-secure.tls: "true"
      traefik.http.routers.erp-sst-secure.tls.certresolver: letsencrypt
      traefik.http.services.erp-sst.loadbalancer.server.port: "8080"
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, 'wget -qO- http://127.0.0.1:8080/health | grep -q ok']
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  logs_data:

networks:
  coolify:
    external: true
