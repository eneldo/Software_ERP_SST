            - generic [ref=f2e152]: Título
            - textbox [ref=f2e153]: POLÍTICA DE SEGURIDAD Y SALUD EN EL TRABAJO – SG-SST
            - generic [ref=f2e154]: Contenido de la política
            - textbox [ref=f2e155]: "Radiología RAD Comprometida con la protección de la vida, la integridad, la seguridad y la salud de sus trabajadores, contratistas, subcontratistas, proveedores y demás partes interesadas, establece como principio fundamental la prevención de accidentes de trabajo, enfermedades laborales y situaciones que puedan afectar el bienestar de las personas durante el desarrollo de sus actividades. La organización se compromete a implementar, mantener y mejorar continuamente el Sistema de Gestión de Seguridad y Salud en el Trabajo – SG-SST, destinando los recursos humanos, técnicos, físicos y financieros necesarios para su adecuado funcionamiento. Para el cumplimiento de esta política, Radiología RAD se compromete a: Identificar los peligros presentes en los lugares y actividades de trabajo. Evaluar y valorar los riesgos laborales. Establecer controles para eliminar los peligros o reducir los riesgos. Prevenir accidentes de trabajo, incidentes y enfermedades laborales. Promover ambientes de trabajo seguros y saludables. Capacitar permanentemente a trabajadores y contratistas en materia de Seguridad y Salud en el Trabajo. Promover la participación activa de los trabajadores en las actividades del SG-SST. Cumplir la legislación colombiana vigente aplicable en materia de riesgos laborales y Seguridad y Salud en el Trabajo. Evaluar periódicamente el desempeño del SG-SST. Implementar acciones de mejora continua orientadas a fortalecer las condiciones de seguridad y salud de la organización. Esta política será divulgada a todos los trabajadores, contratistas y demás partes interesadas y estará disponible en los diferentes centros de trabajo de la organización. Será revisada como mínimo una vez al año y actualizada cuando se presenten cambios significativos en las actividades, procesos, peligros, riesgos o requisitos legales aplicables."
