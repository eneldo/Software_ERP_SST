services:
  db:
    image: postgres:17-alpine
    container_name: erp_sst_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-erp_sst}
      POSTGRES_USER: ${POSTGRES_USER:-erp_sst_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerido}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - erp_sst_net

  redis:
    image: redis:8-alpine
    container_name: erp_sst_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD requerido}"]
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$$REDIS_PASSWORD", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - erp_sst_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: erp_sst_backend
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-erp_sst_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-erp_sst}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      AUTO_CREATE_TABLES: "false"
      RATE_LIMIT_BACKEND: redis
      RATE_LIMIT_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    volumes:
      - uploads_data:/app/app/uploads
      - logs_data:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s = socket.socket(); s.connect(('127.0.0.1', 8000)); s.close()\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - erp_sst_net

  backend-migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    profiles:
      - migrations
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-erp_sst_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-erp_sst}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      AUTO_CREATE_TABLES: "false"
      RATE_LIMIT_ENABLED: "false"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - erp_sst_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: erp_sst_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - erp_sst_net

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  logs_data:

networks:
  erp_sst_net:
    driver: bridge
