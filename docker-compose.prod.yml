services:
  db:
    image: postgres:17-alpine
    container_name: erp_sst_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-erp_sst}
      POSTGRES_USER: ${POSTGRES_USER:-erp_sst_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerido}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - erp_sst_net

  redis:
    image: redis:8-alpine
    container_name: erp_sst_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - erp_sst_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: erp_sst_backend
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-erp_sst_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-erp_sst}
      ENVIRONMENT: production
      AUTO_CREATE_TABLES: "false"
      RATE_LIMIT_BACKEND: redis
      RATE_LIMIT_REDIS_URL: redis://redis:6379/0
    volumes:
      - uploads_data:/app/app/uploads
      - logs_data:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - erp_sst_net

  backend-migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    profiles:
      - migrations
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-erp_sst_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-erp_sst}
      ENVIRONMENT: production
      AUTO_CREATE_TABLES: "false"
      RATE_LIMIT_ENABLED: "false"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - erp_sst_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: erp_sst_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - erp_sst_net

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  logs_data:

networks:
  erp_sst_net:
    driver: bridge
