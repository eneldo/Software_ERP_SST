name: Secret scanning

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tracked-files:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan tracked Markdown and configuration files
        run: python scripts/scan_tracked_secrets.py
      - name: Run static scanner tests
        run: python -m unittest discover -s tests -p test_secret_scan.py
